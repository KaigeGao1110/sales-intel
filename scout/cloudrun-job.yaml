apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: scout-monitor
  labels:
    app: scout
spec:
  template:
    spec:
      template:
        spec:
          containers:
            - image: gcr.io/YOUR_PROJECT/scout:latest
              command: ["python", "main.py", "monitor", "run"]
              env:
                - name: BRAVE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scout-secrets
                      key: brave-api-key
                - name: NEWS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scout-secrets
                      key: news-api-key
                - name: CLEARBIT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scout-secrets
                      key: clearbit-api-key
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: scout-secrets
                      key: openai-api-key
                - name: ALERT_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: scout-secrets
                      key: alert-email
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
          restartPolicy: Never
      maxRetries: 2
---
# Cloud Scheduler job (run daily at 7am UTC)
apiVersion: cloudscheduler.googleapis.com/v1
kind: Job
metadata:
  name: scout-daily-trigger
spec:
  schedule: "0 7 * * *"
  timeZone: "UTC"
  httpTarget:
    uri: https://us-central1-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/YOUR_PROJECT/jobs/scout-monitor:run
    httpMethod: POST
    oauthToken:
      serviceAccountEmail: scout-runner@YOUR_PROJECT.iam.gserviceaccount.com
